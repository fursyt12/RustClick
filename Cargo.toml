[package]
name = "rustclick"
version = "0.2.0"
edition = "2024"
# Slint 1.18 requires Rust 1.92.
rust-version = "1.92"
description = "Routes presentation-remote input to a chosen application without requiring focus"
license = "GPL-3.0-only"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
# slint, slint-build and i-slint-backend-testing must stay on the same version.
slint = "=1.18.1"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[target.'cfg(windows)'.dependencies]
# HID enumeration and Logitech HID++ access. The default C backend is used on
# Windows; the Linux/illumos backends are not needed.
hidapi = { version = "2.6.7", default-features = false }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
png = "0.18"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
